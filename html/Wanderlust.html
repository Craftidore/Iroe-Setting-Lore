<h1 id="the-wanderlust">The Wanderlust</h1>
<p>The Wanderlust is an affliction which strikes a small percentage of
gnomes at puberty. Those afflicted have a yearning desire to travel the
world. Gnomes struck with The Wanderlust, known as <a href="?page=Wandering-Gnomes">Wandering-Gnomes</a>
tend to be jovial and compassionate, unlike their fellow gnomes.</p>
